name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Release tag must match package.json version.");
            }
          '

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Collect coverage
        run: bun run test:coverage

      - name: Verify packed CLI
        run: bun run test:package --pack-destination artifacts

      - name: Retain verified package
        uses: actions/upload-artifact@v7
        with:
          name: gitfo-package-node-${{ matrix.node-version }}
          path: artifacts/
          if-no-files-found: error
